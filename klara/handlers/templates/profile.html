{% extends "base.html" %}
{% set section = "profile" %}
{% block title %}Profile · Klaravex Portal{% endblock %}
{% block content %}
<h1>Your profile</h1>
<div class="card">
  {% if saved %}<p class="pill resolved">Saved.</p>{% endif %}
  <form method="post" action="/portal/profile">
    <div style="margin-bottom:1rem;">
      <label style="display:block;margin-bottom:0.3rem;">Email</label>
      <input type="text" value="{{ email }}" disabled style="width:100%;padding:0.5rem;opacity:0.6;">
    </div>
    <div style="margin-bottom:1rem;">
      <label for="name" style="display:block;margin-bottom:0.3rem;">Display name</label>
      <input type="text" id="name" name="name" maxlength="200" value="{{ client.name or '' }}" style="width:100%;padding:0.5rem;">
    </div>
    <div style="margin-bottom:1rem;">
      <label for="phone" style="display:block;margin-bottom:0.3rem;">Phone</label>
      <input type="text" id="phone" name="phone" maxlength="40" value="{{ client.phone or '' }}" style="width:100%;padding:0.5rem;">
    </div>
    <div style="margin-bottom:1rem;">
      <label for="tz" style="display:block;margin-bottom:0.3rem;">Timezone</label>
      <select id="tz" name="tz" style="width:100%;padding:0.5rem;">
        {% for tz in timezones %}
        <option value="{{ tz }}" {% if client.timezone == tz %}selected{% endif %}>{{ tz }}</option>
        {% endfor %}
      </select>
    </div>
    <button type="submit">Save</button>
  </form>
</div>
{% endblock %}
