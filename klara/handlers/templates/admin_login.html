<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — Klaravex Admin</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #080C12; --surface: #0F1520; --surface-2: #151D2E;
  --border: #1A2338; --text: #C8D6EF; --text-2: #5A7099; --text-3: #3A5070;
  --accent: #3B7BF6; --loki: #8B5CF6; --crit: #EF4444; --crit-dim: rgba(239,68,68,0.1);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #EEF3FC; --surface: #FFFFFF; --surface-2: #F4F7FE;
    --border: #D8E4F5; --text: #0F1E35; --text-2: #5872A0; --text-3: #90AACC;
  }
}
:root[data-theme="dark"] { --bg: #080C12; --surface: #0F1520; --text: #C8D6EF; }
:root[data-theme="light"] { --bg: #EEF3FC; --surface: #FFFFFF; --text: #0F1E35; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  font-size: 13.5px;
  line-height: 1.5;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 36px 32px;
  width: 100%;
  max-width: 380px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 28px;
}

.logo-mark {
  width: 32px; height: 32px;
  background: var(--accent);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
}

.logo-name { font-weight: 700; font-size: 16px; letter-spacing: -0.02em; }
.logo-env {
  margin-left: auto;
  font-size: 10px; font-weight: 600;
  letter-spacing: 0.07em; text-transform: uppercase;
  color: var(--text-2); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 4px; padding: 2px 6px;
}

h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
.sub { font-size: 12.5px; color: var(--text-2); margin-bottom: 24px; }

.err {
  padding: 11px 14px;
  background: var(--crit-dim);
  border-left: 3px solid var(--crit);
  border-radius: 6px;
  color: var(--crit);
  font-size: 12.5px;
  margin-bottom: 18px;
}

.signin-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 11px 16px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  font-size: 13.5px;
  font-weight: 550;
  text-decoration: none;
  margin-bottom: 10px;
  transition: border-color 0.1s, background 0.1s;
  cursor: pointer;
}
.signin-btn:hover { border-color: var(--accent); background: var(--surface); }
.signin-btn:last-child { margin-bottom: 0; }

.signin-icon {
  width: 20px; height: 20px;
  flex-shrink: 0;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
}

.footer {
  margin-top: 24px;
  padding-top: 18px;
  border-top: 1px solid var(--border);
  font-size: 11.5px;
  color: var(--text-3);
  text-align: center;
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo-mark">
      <svg width="16" height="16" viewBox="0 0 14 14" fill="none">
        <polygon points="7,1 13,4.5 13,9.5 7,13 1,9.5 1,4.5" stroke="white" stroke-width="1.4" fill="none"/>
        <circle cx="7" cy="7" r="2" fill="white"/>
      </svg>
    </div>
    <span class="logo-name">Klaravex</span>
    <span class="logo-env">Admin</span>
  </div>

  <h1>Sign in</h1>
  <p class="sub">Access the admin console.</p>

  {% if error %}
  <div class="err">{{ error }}</div>
  {% endif %}

  <a href="/admin/login/google" class="signin-btn">
    <div class="signin-icon" style="background:#fff;border-radius:3px;">
      <svg width="14" height="14" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332C2.438 15.983 5.482 18 9 18z"/>
        <path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/>
        <path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0 5.482 0 2.438 2.017.957 4.958L3.964 6.29C4.672 4.163 6.656 3.58 9 3.58z"/>
      </svg>
    </div>
    Sign in with Google
  </a>

  <a href="/admin/login/microsoft" class="signin-btn">
    <div class="signin-icon" style="background:#fff;border-radius:3px;">
      <svg width="14" height="14" viewBox="0 0 21 21">
        <rect x="1" y="1" width="9" height="9" fill="#f25022"/>
        <rect x="11" y="1" width="9" height="9" fill="#7fba00"/>
        <rect x="1" y="11" width="9" height="9" fill="#00a4ef"/>
        <rect x="11" y="11" width="9" height="9" fill="#ffb900"/>
      </svg>
    </div>
    Sign in with Microsoft 365
  </a>

  <div class="footer">Access is restricted to authorized users.</div>
</div>
<script>
(function(){
  var s=localStorage.getItem('admin-theme');
  if(s) document.documentElement.setAttribute('data-theme',s);
  else {
    var mq=window.matchMedia('(prefers-color-scheme: light)');
    document.documentElement.setAttribute('data-theme',mq.matches?'light':'dark');
  }
})();
</script>
</body>
</html>
