[package]
name = "klaravex-customer-helper"
version = "0.1.0"
edition = "2021"
description = "Klaravex one-time customer-side remote-support helper (G34.2)"
authors = ["Klaravex LLC <support@klaravex.com>"]
license-file = "../../../../LICENSE"
publish = false
rust-version = "1.77"

[[bin]]
name = "klaravex-helper"
path = "src/main.rs"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-deep-link = "2.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
once_cell = "1.19"
anyhow = "1"
thiserror = "1"
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive", "env"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = { version = "0.2", features = ["NSWindow"] }

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"
