<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Klaravex icon">
  <defs>
    <linearGradient id="g" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="18" fill="#0D1117"/>
  <!-- K mark: arms drawn first, stem drawn on top to clean up junction -->
  <rect x="29" y="44" width="60" height="12" transform="rotate(-34,29,50)" fill="url(#g)"/>
  <rect x="29" y="44" width="60" height="12" transform="rotate(34,29,50)" fill="url(#g)"/>
  <rect x="15" y="15" width="14" height="70" fill="url(#g)"/>
</svg>
