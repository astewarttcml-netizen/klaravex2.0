id: A6
name: Microsoft 365 Migration Project
archetype: A6
segment: b2b
channel: stripe_checkout
metadata:
  archetype: A6_b2b_one_time_project
  description: 'M365 migration project ($200/user typical). From on-prem Exchange
    or Google Workspace to M365. Zero-downtime cutover target. Klara AI handles all prep,
    documentation, and communications; Anthony executes all production changes.

    '
  triggers:
  - stripe_event: checkout.session.completed
    sku_filter: &id001
    - m365-migration
  - calendly_booking:
      event_type: m365_migration_sow
states:
  SCOPED:
    description: 'SOW signed + deposit received. Klara AI sends detailed scoping intake
      and generates the project plan.

      '
    on_entry:
    - create_ticket:
        table: klaravex_tickets
        severity: P2
        status: scoped
    - send_email:
        template: m365_migration_scoping
        to: '{{ primary_contact_email }}'
        subject: Klaravex M365 Migration — project intake
        fields:
        - source_environment
        - user_count
        - mailbox_sizes_estimate
        - cutover_window_preference
        - blackout_dates
        - existing_m365_tenant
        - dns_access_instructions
    - calendly_schedule:
        event_type: m365_migration_kickoff
        host: anthony
        notify_anthony: true
    - log_event:
        action: m365_migration_scoped
    transitions:
      on_form_submitted: PILOT
  PILOT:
    description: 'Klara AI generates the project plan (Gantt-style milestones). Pilot
      migration of 1-3 test mailboxes conducted by Anthony. Klara AI documents.

      '
    on_entry:
    - generate_project_plan:
        template: m365_migration_project_plan
        inputs:
        - user_count
        - source_environment
        - cutover_window_preference
        - blackout_dates
        store_url: klaravex_tickets.project_plan_url
    - alert_anthony:
        channels:
        - telegram
        - email
        fields:
        - company_name
        - project_plan_url
        - pilot_scope
    - update_ticket:
        status: pilot
        assignee: anthony
    transitions:
      on_pilot_success: MIGRATION
      on_pilot_issues: PILOT
  MIGRATION:
    description: 'Full mailbox migration. Anthony executes in scheduled batches. Klara AI
      updates client portal every 2 days with migration progress. Klara AI flags any SOW
      deviations to Anthony.

      '
    on_entry:
    - update_ticket:
        status: migration_in_progress
        assignee: anthony
    - schedule_recurring:
        every_2days:
          action: send_email
          template: m365_migration_status_update
          to: '{{ primary_contact_email }}'
    actions:
    - document_migration_steps:
        log_to: klaravex_tickets.history
    - flag_sow_deviations:
        on_deviation: alert_anthony_and_halt
    transitions:
      on_migration_complete: CUTOVER
  CUTOVER:
    description: 'DNS cutover to M365. Anthony executes within the pre-agreed window.
      Klara AI monitors DNS propagation and notifies client when mail flow is confirmed.

      '
    on_entry:
    - update_ticket:
        status: cutover
        assignee: anthony
    - alert_anthony:
        channels:
        - telegram
        - email
        fields:
        - company_name
        - cutover_window
        - dns_change_instructions
    actions:
    - monitor_dns_propagation:
        target_mx: m365_mx_records
        confirm_propagation: true
    - send_email:
        template: m365_cutover_complete
        to: '{{ primary_contact_email }}'
    transitions:
      on_mail_flow_confirmed: STABILIZATION
  STABILIZATION:
    description: '72-hour stabilization window. Klara AI monitors for mail flow issues,
      missed items, or user-reported problems. Anthony on standby.

      '
    on_entry:
    - monitor_mail_flow:
        duration_hours: 72
        alert_on_issues: true
    - send_email:
        template: m365_stabilization_notice
        to: '{{ primary_contact_email }}'
        fields:
        - support_contact
        - known_issues_tracker
    transitions:
      on_stable_72h: CLOSED
      on_critical_issue: MIGRATION
  CLOSED:
    description: 'Migration complete. Klara AI generates final handoff documentation.
      Anthony delivers final walkthrough call. 30-day stability check scheduled.

      '
    on_entry:
    - generate_handoff_docs:
        template: m365_migration_handoff
        fields:
        - final_config_summary
        - admin_guide
        - dns_records_reference
        output: pdf
    - send_email:
        template: m365_migration_complete
        to: '{{ primary_contact_email }}'
        attachments:
        - handoff_docs_pdf
    - calendly_schedule:
        event_type: m365_migration_walkthrough
        host: anthony
    - schedule_followup:
        offset_days: 30
        action: send_email
        template: m365_stability_check
    - schedule_followup:
        offset_days: 60
        action: send_email
        template: upsell_managed_plan
    - update_ticket:
        status: closed
    - log_event:
        action: m365_migration_delivered
    terminal: true
universal_contracts:
  escalation_channel:
    channels:
    - telegram
    - email
  anthony_roles:
  - all_production_execution: always
  - note: Klara AI handles ALL prep, docs, comms. Anthony handles ALL execution.
  sow_deviation_policy:
    on_deviation: halt_and_notify_anthony
  data_layer:
    table_prefix: klaravex_
followup:
- offset_days: 30
  action: send_email
  template: m365_stability_check
- offset_days: 60
  action: send_email
  template: upsell_managed_plan
deliverable_to_client:
- Project plan (Gantt-style milestones)
- Pilot migration (1-3 test mailboxes)
- Full mailbox migration with zero-downtime cutover
- DNS change documentation
- 72-hour stabilization monitoring
- Handoff documentation + admin guide
- Final walkthrough call with Anthony
- 30-day stability check
triggers:
  checkout_session_completed:
    source: stripe_webhook
    event: checkout.session.completed
    entry_state: SCOPED
    sku_filter: *id001
  event_1:
    source: stripe_webhook
    event: event_1
    entry_state: SCOPED
