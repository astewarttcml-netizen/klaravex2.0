<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" role="img" aria-label="Klaravex logo">
  <defs>
    <linearGradient id="g" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- White background -->
  <rect width="460" height="100" rx="12" fill="#FFFFFF"/>
  <!-- Icon badge (dark pill) -->
  <rect x="8" y="8" width="84" height="84" rx="14" fill="#0D1117"/>
  <!-- K mark inside badge -->
  <rect x="29" y="44" width="60" height="12" transform="rotate(-34,29,50)" fill="url(#g)"/>
  <rect x="29" y="44" width="60" height="12" transform="rotate(34,29,50)" fill="url(#g)"/>
  <rect x="15" y="15" width="14" height="70" fill="url(#g)"/>
  <!-- Divider -->
  <line x1="116" y1="22" x2="116" y2="78" stroke="#E2E8F0" stroke-width="1.5"/>
  <!-- Wordmark (dark text for light bg) -->
  <text
    x="138" y="50"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="38"
    letter-spacing="6"
    fill="#0D1117"
    text-anchor="start"
    dominant-baseline="central"
  >KLARAVEX</text>
</svg>
