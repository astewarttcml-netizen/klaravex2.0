<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 100" width="460" height="100" role="img" aria-label="Klaravex logo">
  <defs>
    <linearGradient id="g" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="460" height="100" rx="12" fill="#0D1117"/>
  <!-- Icon (100x100 mark, inset 0 0) -->
  <rect x="0" y="0" width="100" height="100" rx="12" fill="#0D1117"/>
  <rect x="29" y="44" width="60" height="12" transform="rotate(-34,29,50)" fill="url(#g)"/>
  <rect x="29" y="44" width="60" height="12" transform="rotate(34,29,50)" fill="url(#g)"/>
  <rect x="15" y="15" width="14" height="70" fill="url(#g)"/>
  <!-- Divider -->
  <line x1="116" y1="22" x2="116" y2="78" stroke="#2D2F5E" stroke-width="1.5"/>
  <!-- Wordmark -->
  <text
    x="138" y="50"
    font-family="'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-weight="800"
    font-size="38"
    letter-spacing="6"
    fill="#F8FAFC"
    text-anchor="start"
    dominant-baseline="central"
  >KLARAVEX</text>
